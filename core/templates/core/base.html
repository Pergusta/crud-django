<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CRUD de Filmes</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        a.btn, button.btn { display: inline-block; padding: 6px 12px; margin-right: 5px;
            background: #333; color: #fff; text-decoration: none; border: none; cursor: pointer; }
        form p { margin: 10px 0; }
        input, textarea, select { padding: 5px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>🎬 CRUD de Filmes</h1>
    {% block conteudo %}{% endblock %}
</body>
</html>
